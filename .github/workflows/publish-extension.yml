name: Publish Extension

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v2.0.0, v2.1.0
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          if ! jq empty manifest.json 2>/dev/null; then
            echo "❌ manifest.json is invalid JSON"
            exit 1
          fi
          echo "✅ manifest.json is valid"

      - name: Extract version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Extension version: $VERSION"

      - name: Create extension package
        run: |
          # Create clean build directory
          mkdir -p build

          # Copy only necessary files (exclude .git, .github, etc.)
          cp manifest.json build/
          cp content.js build/
          cp LICENSE build/
          cp README.md build/
          cp icon*.png build/
          cp icon.svg build/

          # Create zip file
          cd build
          zip -r ../multisearch-v${{ steps.version.outputs.version }}.zip .
          cd ..

          echo "✅ Created multisearch-v${{ steps.version.outputs.version }}.zip"

      - name: Verify zip contents
        run: |
          echo "📦 Extension package contents:"
          unzip -l multisearch-v${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: multisearch-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to Chrome Web Store using direct API calls
      - name: Publish to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          echo "🔑 Getting access token..."
          
          ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CHROME_CLIENT_ID}" \
            -d "client_secret=${CHROME_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | jq -r '.access_token')
          
          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Failed to get access token"
            curl -s -X POST "https://oauth2.googleapis.com/token" \
              -d "client_id=${CHROME_CLIENT_ID}" \
              -d "client_secret=${CHROME_CLIENT_SECRET}" \
              -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
              -d "grant_type=refresh_token"
            exit 1
          fi
          
          echo "✅ Got access token"
          
          echo "📤 Uploading extension..."
          
          UPLOAD_RESPONSE=$(curl -s -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T "multisearch-v${{ steps.version.outputs.version }}.zip")
          
          echo "Upload response: $UPLOAD_RESPONSE"
          
          UPLOAD_STATE=$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadState')
          
          if [ "$UPLOAD_STATE" != "SUCCESS" ]; then
            echo "❌ Upload failed"
            echo "$UPLOAD_RESPONSE" | jq .
            exit 1
          fi
          
          echo "✅ Upload successful"
          
          echo "🚀 Publishing extension..."
          
          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}/publish" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0")
          
          echo "Publish response: $PUBLISH_RESPONSE"
          
          PUBLISH_STATUS=$(echo "$PUBLISH_RESPONSE" | jq -r '.status[0]')
          
          if [ "$PUBLISH_STATUS" == "OK" ] || [ "$PUBLISH_STATUS" == "PENDING_REVIEW" ]; then
            echo "✅ Extension published successfully (status: $PUBLISH_STATUS)"
          else
            echo "⚠️ Publish status: $PUBLISH_STATUS"
            echo "$PUBLISH_RESPONSE" | jq .
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: multisearch-v${{ steps.version.outputs.version }}.zip
          retention-days: 90
